<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CedarMC | Store Management</title>
  <link rel="stylesheet" href="store.css?v=6">
</head>
<body>
  <header class="store-header">
    <div class="shell store-nav">
      <a class="store-brand" href="/"><strong>CedarMC</strong><small>Store Management</small></a>
      <div class="nav-actions">
        <a class="account-btn" href="/store/">Back to Store</a>
      </div>
    </div>
  </header>

  <main class="shell store-main">
    <section id="statusCard" class="manager-card">
      <h2>Checking your CedarMC account...</h2>
      <p>Store Management uses the same account session as the main store.</p>
    </section>

    <section id="editor" class="hidden">
      <div class="manager-card">
        <div class="manager-title">
          <div><small>CEDARMC STORE</small><h1>Products</h1></div>
          <div><button id="add" class="account-btn">Add Product</button>
          <button id="save" class="account-btn">Save Products</button></div>
        </div>
        <div id="rows"></div>
      </div>
      <section id="usersSection" class="manager-card hidden">
        <h2>Users & Permissions</h2>
        <p>New accounts start as Customer. Owners can grant website store access here.</p>
        <input id="userSearch" placeholder="Search email or Minecraft username">
        <div id="usersBox"></div>
      </section>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script src="manage.js?v=6"></script>
</body>
</html>
